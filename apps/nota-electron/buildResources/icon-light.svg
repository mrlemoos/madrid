<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Nota liquid-glass note stack · light (macOS 26) -->
  <defs>
    <linearGradient id="glassBaseFill" x1="0.15" y1="0" x2="0.85" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#EEF4FA"/>
      <stop offset="35%" stop-color="#C5D5E8"/>
      <stop offset="70%" stop-color="#9BB0CB"/>
      <stop offset="100%" stop-color="#7A93B0"/>
    </linearGradient>
    <radialGradient id="specOrb" cx="0.35" cy="0.18" r="0.65" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheetBackFill" x1="0.2" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D0DCEB" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="sheetMidFill" x1="0.2" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#E2EAF4" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="sheetFrontFill" x1="0.3" y1="0" x2="0.65" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#F7FAFD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D8E4F0" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.5" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect id="glassBase" width="512" height="512" rx="114" fill="url(#glassBaseFill)"/>
  <rect width="512" height="512" rx="114" fill="url(#specOrb)"/>
  <rect width="512" height="512" rx="114" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <g id="sheetBack" transform="rotate(-10 256 256)">
    <rect x="142" y="112" width="228" height="288" rx="36"
      fill="url(#sheetBackFill)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
  </g>

  <g id="sheetMid" transform="rotate(6 256 256)">
    <rect x="148" y="120" width="224" height="284" rx="36"
      fill="url(#sheetMidFill)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3"/>
  </g>

  <g id="sheetFront">
    <rect x="154" y="130" width="204" height="268" rx="34"
      fill="url(#sheetFrontFill)" stroke="#FFFFFF" stroke-opacity="1" stroke-width="3.5"/>
    <rect x="168" y="144" width="176" height="52" rx="18" fill="#FFFFFF" fill-opacity="0.45"/>
    <g stroke="#4A5C72" stroke-opacity="0.42" stroke-width="12" stroke-linecap="round">
      <line x1="186" y1="216" x2="326" y2="216"/>
      <line x1="186" y1="262" x2="298" y2="262"/>
      <line x1="186" y1="308" x2="318" y2="308"/>
    </g>
  </g>
</svg>
