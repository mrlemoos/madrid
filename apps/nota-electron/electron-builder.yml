appId: app.nota.desktop
productName: Nota
electronVersion: 35.7.5
# Workspaces: production install in appDir prunes the repo root node_modules.
npmRebuild: false
# electron-builder only collects top-level node_modules, so anything pnpm nests
# (e.g. electron-updater's `semver`) is silently dropped from the asar and the app
# dies on boot. Keep such packages declared as direct deps of this app so they stay
# hoisted — watch the builder's "dependency not found on disk" warning.
publish:
  provider: github
  owner: mrlemoos
  repo: nota
  # Published (non-draft) releases; CI and local RC builds set EP_DRAFT=true to override.
  releaseType: release
directories:
  output: release
  buildResources: buildResources
protocols:
  # Clerk OAuth completes in the system browser; `nota://oauth-callback` returns the user to Nota.
  - name: Nota Clerk OAuth
    schemes:
      - nota
files:
  - dist/**/*
extraResources:
  - from: buildResources/TrayTemplate.png
    to: TrayTemplate.png
  - from: buildResources/icon.png
    to: icon.png
  - from: buildResources/icon-dark.png
    to: icon-dark.png
mac:
  icon: buildResources/icon.icns
  entitlements: buildResources/entitlements.mac.plist
  entitlementsInherit: buildResources/entitlements.mac.plist
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  # When CSC_* env vars and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set in CI, set to true for notarisation.
  notarize: false
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
