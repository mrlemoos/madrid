name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm audit` cannot separate dev from prod deps in a pnpm workspace, so
      # ~140 of the ~150 advisories here are build tooling that never ships.
      # Gating on `moderate` kept this red for months, which gates nothing and
      # trains everyone to ignore CI. `high` plus advisory-only keeps the report
      # visible without a permanently failing check; shipping regressions are
      # caught by review and Dependabot.
      - name: pnpm audit (high or higher; advisory only)
        continue-on-error: true
        run: pnpm audit --audit-level high
